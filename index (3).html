<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Team Tasks</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#e2e1dc;--ac:#1f6feb;--ok:#1a7f4b;--wip:#b26a00;--no:#d33}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#201f1e;--tx:#f0efea;--mut:#9a9992;--ln:#33322f;--ac:#5aa0ff;--ok:#4cc38a;--wip:#e8a23a;--no:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(80px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:4px 0 10px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tab,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
.tab.on,.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.sm{padding:6px 12px;font-size:13px;text-decoration:none;display:inline-block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:600}.m{color:var(--mut);font-size:13px}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--ln);white-space:nowrap}
.s-Done{color:var(--ok);border-color:var(--ok)}.s-In{color:var(--wip);border-color:var(--wip)}.s-Pending{color:var(--mut)}
input,select,textarea{width:100%;font:inherit;padding:9px;margin:4px 0 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.ck{display:flex;align-items:center;padding:6px 0}.ck input{width:auto;margin:0 10px 0 0}
.dd{border:1px solid var(--ln);border-radius:8px;background:var(--bg);margin:4px 0 8px}.dd summary{padding:9px;cursor:pointer;list-style:none}.dd summary::after{content:"▾";float:right}.dd[open] summary{border-bottom:1px solid var(--ln)}.dd>div{padding:4px 10px}
.acts{display:flex;gap:8px;margin-top:8px}.acts button{flex:1;padding:8px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;background:transparent;border:2px solid}
.acc{color:var(--ok);border-color:var(--ok)}.acc.sel{background:var(--ok);color:#fff}.rej{color:var(--no);border-color:var(--no)}.rej.sel{background:var(--no);color:#fff}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:8px}.cd{padding:7px 0;border-radius:8px;cursor:pointer;font-size:14px}.cd.td{border:1px solid var(--ac)}.cd.sel{background:var(--ac);color:#fff}.dot{display:block;font-size:10px;line-height:1.1;color:var(--wip)}.cd.sel .dot{color:#fff}
.pbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.pbox button{border:0;border-radius:14px;padding:22px 10px;font:inherit;font-size:18px;font-weight:700;color:#fff;cursor:pointer}.pin{background:#1a9b4f}.pout{background:#d33}.pbox button:disabled{opacity:.35;cursor:default}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;background:#9a9992;margin-right:10px}.dotc.g{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.3)}
.tl{border-top:1px solid var(--ln);margin-top:10px;padding-top:8px}
.u{margin:8px 0;font-size:14px}.u img{max-width:100%;border-radius:8px;margin-top:4px;display:block}
.note{padding:20px;text-align:center;color:var(--mut)}.err{color:var(--no);font-size:13px}
</style></head><body>
<h1>📋 Team Tasks</h1>
<div id="app"><div class="note">Loading…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDuP_3_wSOJ57NPKY2yNx2uXzJn6chy1Hs",
  authDomain: "complex-av.firebaseapp.com",
  projectId: "complex-av",
  storageBucket: "complex-av.firebasestorage.app",
  messagingSenderId: "278158481445",
  appId: "1:278158481445:web:745535a04c5f066b3287cc"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const TYPES=["Event","Maintenance","Installation","Other"],STAT=["Pending","In progress","Done"],PERF=["Armando","Ghaith","Pamela","Bassi","Goran","Guest"],DES=["Manager","Supervisor","Admin","Team member","Artist"],MGR=["Manager","Supervisor","Admin"];
let me=null,canM=false,tasks=[],updates=[],users={},duty={},resp={},page="all",open=null,busy=false,unsubs=[],err="",calY=new Date().getFullYear(),calM=new Date().getMonth(),selDay=null,newCount=0,lastCreated=null;
const $=id=>document.getElementById(id),A=()=>$("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=x=>new Date(x).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}),tm=x=>new Date(x).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const nm=id=>id?(users[id]?users[id].name:"Someone"):"Unassigned";
const cls=s=>"s-"+s.split(" ")[0],asg=t=>t.assignees||(t.assignee?[t.assignee]:[]),perf=t=>(t.performers&&t.performers.join(", "))||t.performer||"";
const rs=(t,i)=>(resp[t+"_"+i]||{}).status,ic=s=>s=="accepted"?"✅":s=="rejected"?"❌":"⏳";
const latest=t=>{const u=updates.filter(x=>x.taskId===t.id).sort((a,b)=>b.at-a.at);return u[0]?u[0].status:"Pending"};
const okPh=p=>p.replace(/\D/g,"").length>=8,digits=p=>p.replace(/\D/g,"");
const msg=e=>({"auth/invalid-credential":"Wrong email or password","auth/email-already-in-use":"Email already in use","auth/weak-password":"Password needs 6+ characters","auth/invalid-email":"Invalid email"}[e.code]||e.message);
const opts=a=>a.map(x=>`<option>${x}</option>`).join("");

async function showLogin(){
  let setup=false;try{setup=!(await db.doc("config/leader").get()).exists}catch(e){}
  A().innerHTML=`<div class="card"><div class="t">${setup?"First-time setup: create the main account":"Sign in"}</div>
  ${setup?`<input id="n" placeholder="Your name"><input id="ph" type="tel" placeholder="Phone with country code, e.g. +971501234567"><select id="de"><option value="">Designation</option>${opts(DES)}</select>`:""}
  <input id="e" type="email" placeholder="Email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err">${esc(err)}</div><button class="btn p" onclick="${setup?"doSetup()":"doLogin()"}">${setup?"Create account":"Sign in"}</button></div>`;
}
async function doLogin(){err="";try{await auth.signInWithEmailAndPassword($("e").value.trim(),$("p").value)}catch(e){err=msg(e);showLogin()}}
async function doSetup(){
  const name=$("n").value.trim(),phone=$("ph").value.trim(),designation=$("de").value,email=$("e").value.trim(),pw=$("p").value;
  if(!name||!okPh(phone)||!designation)return alert("Enter your name, phone number and designation");
  busy=true;try{const c=await auth.createUserWithEmailAndPassword(email,pw),uid=c.user.uid,b=db.batch();
    b.set(db.doc("config/leader"),{owner:uid});b.set(db.doc("users/"+uid),{name,email,phone,designation,role:"leader"});await b.commit();busy=false;start(c.user)}
  catch(e){busy=false;err=msg(e);showLogin()}
}
function start(u){
  me=u.uid;const L=(c,f)=>unsubs.push(db.collection(c).onSnapshot(s=>{f(s);render()},()=>{}));
  L("users",s=>{users={};s.forEach(d=>users[d.id]=d.data());const x=users[me];canM=!!(x&&(x.role==="leader"||MGR.includes(x.designation)));if(!canM&&(page=="new"||page=="team"))page="all"});
  L("tasks",s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));checkNew()});
  L("updates",s=>{updates=s.docs.map(d=>({id:d.id,...d.data()}))});
  L("duty",s=>{duty={};s.forEach(d=>duty[d.id]=d.data())});
  L("responses",s=>{resp={};s.forEach(d=>resp[d.id]=d.data())});
}
auth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];if(busy)return;if(!u){me=null;showLogin()}else start(u)});

function checkNew(){
  if(!me)return;let seen=0;try{seen=+localStorage.getItem("seen_"+me);if(!seen){localStorage.setItem("seen_"+me,Date.now());return}}catch(e){return}
  const n=tasks.filter(t=>asg(t).includes(me)&&t.by!==me&&t.created>seen).length;
  if(n>newCount){try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
  newCount=n;document.title=(n?"("+n+") ":"")+"Team Tasks";
}
function dismissNew(){try{localStorage.setItem("seen_"+me,Date.now())}catch(e){}newCount=0;document.title="Team Tasks";render(1)}
const noticeHtml=()=>newCount?`<div class="card" style="border-color:var(--ac)" onclick="dismissNew()">🔔 <b>${newCount} new task${newCount>1?"s":""} assigned to you</b> <span class="m">(tap to dismiss)</span></div>`:"";
const createdHtml=()=>lastCreated?`<div class="card">✅ Task assigned.<div style="margin-top:8px"><a class="btn p sm" target="_blank" href="https://wa.me/?text=${encodeURIComponent(lastCreated.txt)}">Notify on WhatsApp</a> <button class="btn sm" onclick="lastCreated=null;render(1)">Close</button></div></div>`:"";
function go(k){page=k;if(k=="calendar")selDay=selDay||ds(new Date());else selDay=null;render(1)}

function render(f){
  if(!f){const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&A().contains(ae))return;if((page=="new"&&$("f_t"))||(page=="team"&&$("m_n")))return}
  if(!me||!users[me]){A().innerHTML='<div class="note">Loading…</div>';return}
  const dc=dutyCount(),T=(k,l)=>`<button class="tab ${page==k?"on":""}" onclick="go('${k}')">${l}</button>`;
  const bar=`<div class="bar">${T("all","All")}${T("mine","My tasks")}${T("calendar","📅 Calendar")}${T("online","🟢 Online"+(dc?" ("+dc+")":""))}${canM?T("new","＋ New task")+T("team","👥 Team"):""}<button class="btn" onclick="auth.signOut()">Sign out</button></div>`;
  let body="";
  if(page=="online")body=onlineHtml();else if(page=="new"&&canM)body=taskForm();else if(page=="team"&&canM)body=teamPanel();
  else{let L=tasks.slice().sort((a,b)=>b.created-a.created);if(page=="mine")L=L.filter(t=>asg(t).includes(me));if(page=="calendar")L=L.filter(t=>taskDays(t).includes(selDay));
    body=(page=="all"?createdHtml():"")+(page=="calendar"?calHtml():"")+(L.length?L.map(card).join(""):`<div class="note">${page=="calendar"?"No tasks on this day.":"No tasks yet."}</div>`)}
  A().innerHTML=noticeHtml()+bar+body;
}

/* ---- Calendar ---- */
function taskDays(t){if(t.start){const b=new Date(t.end),o=[],a=new Date(t.start),d=new Date(a.getFullYear(),a.getMonth(),a.getDate());while(d<=b&&o.length<60){o.push(ds(d));d.setDate(d.getDate()+1)}return o}return t.due?[t.due]:[]}
function calHtml(){
  const cnt={};tasks.forEach(t=>taskDays(t).forEach(d=>cnt[d]=(cnt[d]||0)+1));
  const first=new Date(calY,calM,1),st=first.getDay(),dim=new Date(calY,calM+1,0).getDate(),today=ds(new Date());
  let c="";for(let i=0;i<st;i++)c+="<div></div>";
  for(let d=1;d<=dim;d++){const k=calY+"-"+pad(calM+1)+"-"+pad(d),n=cnt[k]||0;c+=`<div class="cd ${k==selDay?"sel":""} ${k==today?"td":""}" onclick="pickDay('${k}')">${d}${n?`<span class="dot">${n} task${n>1?"s":""}</span>`:""}</div>`}
  return `<div class="card"><div class="row" style="align-items:center"><button class="tab" onclick="moveCal(-1)">‹</button><b>${first.toLocaleString([],{month:"long",year:"numeric"})}</b><button class="tab" onclick="moveCal(1)">›</button></div><div class="cg">${"SMTWTFS".split("").map(x=>`<div class="m">${x}</div>`).join("")}${c}</div><div class="m" style="margin-top:8px">Tasks on ${selDay}</div></div>`}
function pickDay(k){selDay=k;render(1)}
function moveCal(n){calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render(1)}

/* ---- Online / duty ---- */
const dutyCount=()=>Object.keys(users).filter(i=>duty[i]&&duty[i].on).length;
function onlineHtml(){
  const mine=duty[me]&&duty[me].on,isOn=i=>duty[i]&&duty[i].on?1:0;
  const ids=Object.keys(users).sort((a,b)=>isOn(b)-isOn(a)||(users[a].name||"").localeCompare(users[b].name||""));
  return `<div class="pbox"><button class="pin" ${mine?"disabled":""} onclick="punch(true)">Punch In</button><button class="pout" ${mine?"":"disabled"} onclick="punch(false)">Punch Out</button></div>
  <div class="card"><div class="t">Team members · ${dutyCount()} on duty</div>${ids.map(i=>{const u=users[i],d=duty[i],o=isOn(i),ph=u.phone||"";return `<div style="padding:10px 0;border-top:1px solid var(--ln)"><div><span class="dotc ${o?"g":""}"></span><b>${esc(u.name)}</b>${i==me?" (you)":""} <span class="m">· ${esc(u.designation||"Team member")}</span></div><div class="m" style="margin-left:22px">${o?"On duty since "+tm(d.since):(d&&d.out?"Off duty · last out "+fmt(d.out):"Off duty")}</div>
  <div style="margin:6px 0 0 22px;display:flex;gap:8px;flex-wrap:wrap">${ph&&i!=me?`<a class="btn sm" href="tel:${esc(ph.replace(/[^\d+]/g,""))}">📞 Call</a><a class="btn sm" target="_blank" href="https://wa.me/${digits(ph)}">💬 WhatsApp</a>`:""}${canM&&o&&i!=me?`<button class="btn sm" onclick="punchOut('${i}')">Punch out</button>`:""}</div></div>`}).join("")}</div>`}
async function punch(on){const d=duty[me]||{};try{await db.collection("duty").doc(me).set(on?{on:true,since:Date.now(),out:d.out||0}:{on:false,since:d.since||0,out:Date.now()})}catch(e){alert(msg(e))}}
async function punchOut(id){if(!confirm("Punch out "+nm(id)+"?"))return;const d=duty[id]||{};try{await db.collection("duty").doc(id).set({on:false,since:d.since||0,out:Date.now()})}catch(e){alert(msg(e))}}

/* ---- New task ---- */
function sumUpd(c,id,empty){const a=[...document.querySelectorAll("."+c+":checked")].map(x=>x.dataset.n);$(id).textContent=a.length?a.join(", "):empty}
function evToggle(){const v=$("f_ty").value;$("ev").style.display=v=="Event"?"block":"none";$("du").style.display=v&&v!="Event"?"block":"none"}
function gnToggle(){$("f_gn").style.display=document.querySelector('.pf[data-n="Guest"]').checked?"block":"none"}
function taskForm(){return `<div class="card"><div class="t">New task</div><input id="f_t" placeholder="Task title">
<select id="f_ty" onchange="evToggle()"><option value="">Task</option>${opts(TYPES)}</select>
<div id="ev" style="display:none"><div class="m">Start</div><input id="f_s" type="datetime-local"><div class="m">Finish</div><input id="f_e" type="datetime-local">
<details class="dd"><summary><b>Performer:</b> <span id="pf_s">Select performer</span></summary><div>${PERF.map(x=>`<label class="ck"><input type="checkbox" class="pf" data-n="${x}" onchange="sumUpd('pf','pf_s','Select performer');gnToggle()">${x}</label>`).join("")}<input id="f_gn" placeholder="Guest name (optional)" style="display:none"></div></details></div>
<div id="du" style="display:none"><div class="m">Date (shows on calendar, optional)</div><input id="f_d" type="date"></div>
<details class="dd"><summary><b>Assign:</b> <span id="as_s">Select team members</span></summary><div>${Object.keys(users).map(i=>`<label class="ck"><input type="checkbox" class="as" value="${i}" data-n="${esc(users[i].name)}" onchange="sumUpd('as','as_s','Select team members')">${esc(users[i].name)} <span class="m">&nbsp;· ${esc(users[i].designation||"Team member")}</span></label>`).join("")}</div></details>
<textarea id="f_x" rows="3" placeholder="Work details"></textarea>
<div class="m">Photos (optional, up to 3)</div><input type="file" id="f_ph" accept="image/*" multiple>
<button class="btn p" id="ab" onclick="addTask()">Assign task</button></div>`}
async function addTask(){
  const title=$("f_t").value.trim(),type=$("f_ty").value;if(!title)return alert("Enter a title");if(!type)return alert("Select the task type");
  const ids=[...document.querySelectorAll(".as:checked")].map(c=>c.value);if(!ids.length)return alert("Select at least one team member");
  const d={title,type,assignees:ids,details:$("f_x").value.trim(),created:Date.now(),by:me};
  if(type=="Event"){const s=new Date($("f_s").value).getTime(),e=new Date($("f_e").value).getTime();
    if(!s||!e)return alert("Enter start and finish time");if(e<=s)return alert("Finish must be after start");
    const g=$("f_gn").value.trim();d.start=s;d.end=e;d.performers=[...document.querySelectorAll(".pf:checked")].map(c=>c.dataset.n=="Guest"&&g?"Guest – "+g:c.dataset.n)}else d.due=$("f_d").value;
  const b=$("ab");b.disabled=true;b.textContent="Saving…";
  try{d.photos=await Promise.all([...$("f_ph").files].slice(0,3).map(f=>shrink(f,900,.6)));
    await db.collection("tasks").add(d);
    lastCreated={txt:"📋 New task: "+title+"\n"+type+(d.start?"\n🕒 "+fmt(d.start)+" → "+fmt(d.end):d.due?"\n📅 "+d.due:"")+"\n👤 "+ids.map(nm).join(", ")+(d.performers&&d.performers.length?"\n🎤 "+d.performers.join(", "):"")+(d.details?"\n"+d.details:"")};
    page="all";render(1)}
  catch(e){alert(msg(e));b.disabled=false;b.textContent="Assign task"}
}

/* ---- Team ---- */
function teamPanel(){return `<div class="card"><div class="t">Team members</div>${Object.keys(users).map(i=>`<div class="m" style="padding:3px 0">${esc(users[i].name)} · ${esc(users[i].designation||"Team member")}${users[i].phone?" · "+esc(users[i].phone):""} · ${esc(users[i].email)}</div>`).join("")}
<div class="tl"><div class="t">Add member</div><input id="m_n" placeholder="Name"><input id="m_ph" type="tel" placeholder="Phone with country code, e.g. +971501234567">
<select id="m_de"><option value="">Designation</option>${opts(DES)}</select><input id="m_e" type="email" placeholder="Email"><input id="m_p" type="text" placeholder="Temporary password (6+ chars)">
<button class="btn p" onclick="addMember()">Add member</button></div></div>`}
async function addMember(){
  const name=$("m_n").value.trim(),phone=$("m_ph").value.trim(),designation=$("m_de").value,email=$("m_e").value.trim(),pw=$("m_p").value;
  if(!name||!email||!designation)return alert("Enter name, designation and email");if(!okPh(phone))return alert("Enter a valid phone number with country code");
  try{const sec=firebase.apps.find(a=>a.name=="sec")||firebase.initializeApp(firebaseConfig,"sec");
    const c=await sec.auth().createUserWithEmailAndPassword(email,pw);
    await db.doc("users/"+c.user.uid).set({name,email,phone,designation,role:"member"});await sec.auth().signOut();
    alert("Member added. Share the app link, email and password with "+name+".");render(1)}
  catch(e){alert(msg(e))}
}

/* ---- Task card ---- */
function card(t){
  const st=latest(t),o=open===t.id,ups=updates.filter(x=>x.taskId===t.id).sort((a,b)=>b.at-a.at),mineT=asg(t).includes(me),can=mineT||canM,r=rs(t.id,me);
  return `<div class="card"><div class="row" onclick="open=${o?"null":`'${t.id}'`};render(1)" style="cursor:pointer"><div><div class="t">${esc(t.title)}</div><div class="m">${esc(t.type)}${t.due?" · 📅 "+esc(t.due):""}</div>${t.start?`<div class="m">🕒 ${fmt(t.start)} → ${fmt(t.end)}</div>`:""}${perf(t)?`<div class="m">🎤 Performer: ${esc(perf(t))}</div>`:""}<div class="m">👤 ${asg(t).map(i=>esc(nm(i))+" "+ic(rs(t.id,i))).join(", ")||"Unassigned"}</div></div><span class="chip ${cls(st)}">${st}</span></div>
  ${mineT?`<div class="acts"><button class="acc ${r=="accepted"?"sel":""}" onclick="respond('${t.id}','accepted')">✔ Accept</button><button class="rej ${r=="rejected"?"sel":""}" onclick="respond('${t.id}','rejected')">✖ Reject</button></div>`:""}
  ${o?`<div class="tl">${t.details?`<div>${esc(t.details)}</div>`:""}${(t.photos||[]).map(x=>`<img src="${x}" style="max-width:100%;border-radius:8px;margin-top:6px;display:block">`).join("")}
  ${ups.map(u=>`<div class="u"><b>${esc(u.status)}</b> · ${esc(nm(u.by))} · <span class="m">${fmt(u.at)}</span>${u.note?`<div>${esc(u.note)}</div>`:""}${u.photo?`<img src="${u.photo}">`:""}</div>`).join("")||'<div class="m">No updates yet.</div>'}
  ${can?`<div class="tl"><select id="st">${STAT.map(s=>`<option ${s==st?"selected":""}>${s}</option>`).join("")}</select><textarea id="nt" rows="2" placeholder="Note (optional)"></textarea><input type="file" id="ph" accept="image/*" capture="environment"><button class="btn p" id="ub" onclick="sendUpdate('${t.id}')">Post update</button></div>`:""}
  ${canM?`<button class="btn" style="margin-top:8px" onclick="delTask('${t.id}')">Delete task</button>`:""}</div>`:""}</div>`;
}
async function respond(id,status){try{await db.collection("responses").doc(id+"_"+me).set({taskId:id,uid:me,status,at:Date.now()})}catch(e){alert(msg(e))}}
async function delTask(id){if(confirm("Delete this task?"))try{await db.collection("tasks").doc(id).delete()}catch(e){alert(msg(e))}}
function shrink(f,mx=1000,q=.65){return new Promise((r,j)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",q))};i.onerror=()=>j(new Error("Bad image"));i.src=URL.createObjectURL(f)})}
async function sendUpdate(taskId){
  const b=$("ub");b.disabled=true;b.textContent="Posting…";
  try{const f=$("ph").files[0],photo=f?await shrink(f):null;
    await db.collection("updates").add({taskId,status:$("st").value,note:$("nt").value.trim(),photo,by:me,at:Date.now()})}
  catch(e){alert("Failed: "+msg(e));b.disabled=false;b.textContent="Post update"}
}
