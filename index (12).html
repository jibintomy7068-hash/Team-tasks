/* ---- Calendar ---- */
function taskDays(t){if(t.start){const b=new Date(t.end),o=[],a=new Date(t.start),d=new Date(a.getFullYear(),a.getMonth(),a.getDate());while(d<=b&&o.length<60){o.push(ds(d));d.setDate(d.getDate()+1)}return o}return t.due?[t.due]:[]}
function calHtml(){
  const cnt={};tasks.forEach(t=>taskDays(t).forEach(d=>cnt[d]=(cnt[d]||0)+1));
  const first=new Date(calY,calM,1),st=first.getDay(),dim=new Date(calY,calM+1,0).getDate(),today=ds(new Date());
  let c="";for(let i=0;i<st;i++)c+="<div></div>";
  for(let d=1;d<=dim;d++){const k=calY+"-"+pad(calM+1)+"-"+pad(d),n=cnt[k]||0;c+=`<div class="cd ${k==selDay?"sel":""} ${k==today?"td":""}" onclick="pickDay('${k}')">${d}${n?`<span class="dot">${n} task${n>1?"s":""}</span>`:""}</div>`}
  return `<div class="card"><div class="row" style="align-items:center"><button class="tab" onclick="moveCal(-1)">‹</button><b>${first.toLocaleString([],{month:"long",year:"numeric"})}</b><button class="tab" onclick="moveCal(1)">›</button></div><div class="cg">${"SMTWTFS".split("").map(x=>`<div class="m">${x}</div>`).join("")}${c}</div><div class="m" style="margin-top:8px">Tasks on ${selDay}</div></div>`}
function pickDay(k){selDay=k;render(1)}
function moveCal(n){calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render(1)}

const dutyCount=()=>Object.keys(users).filter(i=>duty[i]&&duty[i].on).length;
const ROLES=["Manager","Supervisor","Admin","Team member","Artist"],ROLEH={Manager:"MANAGER",Supervisor:"SUPERVISOR",Admin:"ADMIN","Team member":"TEAM MEMBERS",Artist:"ARTIST"};

  const rowH=i=>{const u=users[i],d=duty[i],o=isOn(i),ph=u.phone||"";return `<div class="rw" style="padding:10px 0;border-top:1px solid var(--ln)"><div><span class="dotc ${o?"g":""}"></span><b>${esc(u.name)}</b>${i==me?" (you)":""}</div><div class="m" style="margin-left:22px">${o?"On duty since "+tm(d.since):(d&&d.out?"Off duty · last out "+fmt(d.out):"Off duty")}</div>
  <div style="margin:6px 0 0 22px;display:flex;gap:8px;flex-wrap:wrap">${ph&&i!=me?`<a class="btn sm" href="tel:${esc(ph.replace(/[^\d+]/g,""))}">📞 Call</a><a class="btn sm" target="_blank" href="https://wa.me/${digits(ph)}">💬 WhatsApp</a>`:""}${!ph&&i!=me?'<span class="m">No phone number added'+(canM?' · add it in Team → Edit':'')+'</span>':""}${isAdm&&o&&i!=me?`<button class="btn sm" onclick="punchOut('${i}')">Punch out</button>`:""}</div></div>`};
  const groups=ROLES.map(r=>{const ids=Object.keys(users).filter(i=>roleOf(i)==r).sort((a,b)=>isOn(b)-isOn(a)||(users[a].name||"").localeCompare(users[b].name||""));if(!ids.length)return"";
    return `<div class="card"><div class="gh"><span>${ROLEH[r]}</span><span class="m" style="font-weight:500;letter-spacing:0">${ids.filter(isOn).length} on duty</span></div>${ids.map(rowH).join("")}</div>`}).join("");
  return `<div class="pbox"><button class="pin" ${mine?"disabled":""} onclick="punch(true)">Punch In</button><button class="pout" ${mine?"":"disabled"} onclick="punch(false)">Punch Out</button></div>`+groups}
async function punch(on){const d=duty[me]||{};try{await db.collection("duty").doc(me).set(on?{on:true,since:Date.now(),out:d.out||0}:{on:false,since:d.since||0,out:Date.now()})}catch(e){alert(msg(e))}}
async function punchOut(id){if(!confirm("Punch out "+nm(id)+"?"))return;const d=duty[id]||{};try{await db.collection("duty").doc(id).set({on:false,since:d.since||0,out:Date.now()})}catch(e){alert(msg(e))}}

/* ---- New task ---- */
function sumUpd(c,id,empty){const a=[...document.querySelectorAll("."+c+":checked")].map(x=>x.dataset.n);$(id).textContent=a.length?a.join(", "):empty}
function rpToggle(){$("rp_u").style.display=$("f_rp").value?"block":"none"}
function evToggle(){const v=$("f_ty").value;$("ev").style.display=v=="Event"?"block":"none";$("du").style.display=v&&v!="Event"?"block":"none"}
function gnToggle(){$("f_gn").style.display=document.querySelector('.pf[data-n="Guest"]').checked?"block":"none"}
function taskForm(t){t=t||{};
  const E=t.type=="Event",AS=asg(t),AR=art(t),hm=x=>x?pad(new Date(x).getHours())+":"+pad(new Date(x).getMinutes()):"",artists=Object.keys(users).filter(i=>users[i].designation=="Artist"),team=Object.keys(users).filter(i=>users[i].designation!="Artist");
  return `<div class="card"><div class="t">${t.id?"Edit task":"New task"}</div><input id="f_t" placeholder="Task title" value="${esc(t.title||"")}"><input id="f_pl" placeholder="Place" value="${esc(t.place||"")}">
<select id="f_ty" onchange="evToggle()"><option value="">Task</option>${TYPES.map(x=>`<option ${x==t.type?"selected":""}>${x}</option>`).join("")}</select>
<div id="ev" style="display:${E?"block":"none"}"><div class="m">Date</div><input id="f_ed" type="date" value="${t.start?ds(new Date(t.start)):""}"><div class="m">Start time</div><input id="f_s" type="time" value="${hm(t.start)}"><div class="m">Finish time</div><input id="f_e" type="time" value="${hm(t.end)}">
<details class="dd"><summary><b>Artist:</b> <span id="pf_s">${esc(AR.map(nm).join(", ")||"Select artist")}</span></summary><div>${artists.length?artists.map(i=>`<label class="ck"><input type="checkbox" class="pf" value="${i}" data-n="${esc(users[i].name)}" ${AR.includes(i)?"checked":""} onchange="sumUpd('pf','pf_s','Select artist')">${esc(users[i].name)}</label>`).join(""):'<div class="m" style="padding:8px 0">No artists registered yet. Add one in Team with the designation Artist.</div>'}</div></details>
<input id="f_gn" placeholder="Guest artist name (optional)" value="${esc(t.guest||"")}"></div>
<div id="du" style="display:${t.type&&!E?"block":"none"}"><div class="m">Date (shows on calendar, optional)</div><input id="f_d" type="date" value="${esc(t.due||"")}"></div>
${t.series?`<div class="m">🔁 Repeats every ${esc(t.rep)} until ${esc(t.until)}</div><label class="ck"><input type="checkbox" id="f_all" checked>Apply these changes to all upcoming tasks in this series</label>`:`<div class="m">Repeat</div><select id="f_rp" onchange="rpToggle()"><option value="">Does not repeat</option><option value="day">Every day</option><option value="week">Every week</option><option value="month">Every month</option></select><div id="rp_u" style="display:none"><div class="m">Repeat until</div><input id="f_ru" type="date"></div>`}
<details class="dd"><summary><b>Assign:</b> <span id="as_s">${esc(AS.map(nm).join(", ")||"Select team members")}</span></summary><div>${team.map(i=>`<label class="ck"><input type="checkbox" class="as" value="${i}" data-n="${esc(users[i].name)}" ${AS.includes(i)?"checked":""} onchange="sumUpd('as','as_s','Select team members')">${esc(users[i].name)} <span class="m">&nbsp;· ${esc(users[i].designation||"Team member")}</span></label>`).join("")}</div></details>
<textarea id="f_x" rows="3" placeholder="Work details">${esc(t.details||"")}</textarea>
<div class="m">Photos (optional, up to 3${t.id?"; choose only to replace the current ones":""})</div><input type="file" id="f_ph" accept="image/*" multiple>
<button class="btn p" id="ab" onclick="addTask()">${t.id?"Save changes":"Assign task"}</button>${t.id?` <button class="btn" onclick="go('home')">Cancel</button>`:""}</div>`}
function occDates(d0,rep,until){const out=[],y=d0.getFullYear(),m=d0.getMonth(),dd=d0.getDate();
  for(let k=0;k<400;k++){let d;if(rep=="day")d=new Date(y,m,dd+k);else if(rep=="week")d=new Date(y,m,dd+7*k);else{const last=new Date(y,m+k+1,0).getDate();d=new Date(y,m+k,Math.min(dd,last))}
    if(ds(d)>until)break;out.push(d);if(out.length>60)break}
  return out}
const dateOf=t=>t.start?ds(new Date(t.start)):t.due||"";
async function addTask(){
  const title=$("f_t").value.trim(),type=$("f_ty").value,place=$("f_pl").value.trim();if(!title)return alert("Enter a title");if(!type)return alert("Select the task type");
  const ids=[...document.querySelectorAll(".as:checked")].map(c=>c.value);if(!ids.length)return alert("Select at least one team member");
  const E=type=="Event",DEL=firebase.firestore.FieldValue.delete(),details=$("f_x").value.trim(),rep=$("f_rp")?$("f_rp").value:"",until=$("f_ru")?$("f_ru").value:"",all=!!($("f_all")&&$("f_all").checked);
  let base,s0,e0;if(E){base=$("f_ed").value;s0=$("f_s").value;e0=$("f_e").value;if(!base||!s0||!e0)return alert("Enter the date, start time and finish time")}else base=$("f_d").value;
  if(rep){if(!base)return alert("Choose the date first, so the task can repeat");if(!until||until<base)return alert("Choose a 'repeat until' date after the first date")}
  const art=E?[...document.querySelectorAll(".pf:checked")].map(c=>c.value):[],guest=E?$("f_gn").value.trim():"";
  const fields=dt=>{const d={title,type,place,assignees:ids,details};
    if(E){const st=new Date(dt+"T"+s0).getTime();let en=new Date(dt+"T"+e0).getTime();if(en<=st)en+=864e5;d.start=st;d.end=en;d.artists=art;d.guest=guest;if(editT)d.due=DEL}
    else{d.due=dt||"";if(editT){d.start=DEL;d.end=DEL;d.artists=DEL;d.guest=DEL}}
    if(editT)d.performers=DEL;return d};
  const b=$("ab");b.disabled=true;b.textContent="Saving…";
  try{const f=[...$("f_ph").files].slice(0,3),photos=await Promise.all(f.map(x=>shrink(x,900,.6))),bt=db.batch();
    if(editT){const t0=tasks.find(x=>x.id==editT),d=fields(base);if(f.length)d.photos=photos;
      if(inv(t0).slice().sort().join()!=[...new Set([...ids,...art])].sort().join())d.assigned=Date.now();
      bt.update(db.collection("tasks").doc(editT),d);
      if(t0.series&&all){const myd=dateOf(t0);tasks.filter(o=>o.series==t0.series&&o.id!=t0.id&&dateOf(o)>myd).forEach(o=>bt.update(db.collection("tasks").doc(o.id),fields(dateOf(o))))}
      if(rep&&!t0.series){const dts=occDates(new Date(base+"T00:00"),rep,until);if(dts.length>60)throw new Error("Too many repeats (max 60). Choose an earlier end date.");const sid=Date.now().toString(36);
        bt.update(db.collection("tasks").doc(editT),{series:sid,rep,until});
        dts.slice(1).forEach((x,k)=>{const nd=fields(ds(x));Object.keys(nd).forEach(q=>{if(nd[q]===DEL)delete nd[q]});bt.set(db.collection("tasks").doc(),{...nd,created:Date.now()+k,by:me,series:sid,rep,until,photos:[]})})}
      await bt.commit();editT=null}
    else{const dts=rep?occDates(new Date(base+"T00:00"),rep,until):[null];if(dts.length>60)throw new Error("Too many repeats (max 60). Choose an earlier end date.");
      const sid=rep?Date.now().toString(36):null;let first;
      dts.forEach((x,k)=>{const r=db.collection("tasks").doc();if(!k)first=r.id;const nd=fields(x?ds(x):base);Object.assign(nd,{created:Date.now()+k,by:me,photos:k?[]:photos});if(rep)Object.assign(nd,{series:sid,rep,until});bt.set(r,nd)});
      await bt.commit();lastCreated={id:first,ev:E}}
    page="home";render(1)}
  catch(e){alert(msg(e));b.disabled=false;b.textContent=editT?"Save changes":"Assign task"}
}

async function saveMember(i){const name=$("e_n").value.trim(),phone=$("e_ph").value.trim(),designation=$("e_de").value;if(!name)return alert("Enter a name");if(!okPh(phone))return alert("Enter a valid phone number with country code");try{await db.doc("users/"+i).update({name,phone,designation});editId=null;render(1)}catch(e){alert(msg(e))}}
async function resetPw(email){if(!email)return alert("No email address");try{await auth.sendPasswordResetEmail(email);alert("Password reset email sent to "+email+". It may arrive in spam.")}catch(e){alert(msg(e))}}
async function addMember(){
  const name=$("m_n").value.trim(),phone=$("m_ph").value.trim(),designation=$("m_de").value,email=$("m_e").value.trim(),pw=$("m_p").value;
  if(!name||!email||!designation)return alert("Enter name, designation and email");if(!okPh(phone))return alert("Enter a valid phone number with country code");
  try{const sec=firebase.apps.find(a=>a.name=="sec")||firebase.initializeApp(firebaseConfig,"sec");
    const c=await sec.auth().createUserWithEmailAndPassword(email,pw);
    await db.doc("users/"+c.user.uid).set({name,email,phone,designation,role:"member"});await sec.auth().signOut();
    alert("Member added. Share the app link, email and password with "+name+".");render(1)}
  catch(e){alert(e.code=="auth/email-already-in-use"?"This email already has a login (for example a removed member). Use another email, or delete the old login in Firebase: Authentication, then Users.":msg(e))}
}

/* ---- Calendar links ---- */
const base=()=>location.origin+location.pathname;
function waText(t){const who=a=>a.map(i=>"@"+nm(i));return "📋 New task: "+t.title+"\n"+t.type+(t.start?"\n🕒 "+evWhen(t):t.due?"\n📅 "+t.due:"")+(t.place?"\n📍 "+t.place:"")+(t.rep?"\n🔁 Every "+t.rep+" until "+t.until:"")+"\n👤 "+who(asg(t)).join(", ")+(art(t).length||t.guest?"\n🎤 Artist: "+[...who(art(t)),...(t.guest?["Guest – "+t.guest]:[])].join(", "):"")+(t.details?"\n"+t.details:"")+"\n\n✅ Accept: "+base()+"?t="+t.id+"&r=accept\n❌ Reject: "+base()+"?t="+t.id+"&r=reject"}
const waUrl=t=>"https://wa.me/?text="+encodeURIComponent(waText(t));
const z=x=>new Date(x).toISOString().replace(/[-:]|\.\d{3}/g,"");
const gcal=(t,g)=>"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t.title)+"&dates="+z(t.start)+"/"+z(t.end)+"&location="+encodeURIComponent(t.place||"")+"&details="+encodeURIComponent((t.details||"")+(perf(t)?"\nArtist: "+perf(t):""))+(g?"&add="+inv(t).map(i=>users[i]&&users[i].email).filter(Boolean).map(encodeURIComponent).join(","):"");
const calBtns=(id,g)=>{const t=tasks.find(x=>x.id==id);return t&&t.start?`<a class="btn sm" target="_blank" href="${gcal(t,g)}">📅 Google Calendar</a><button class="btn sm" onclick="icsDl('${id}')">⏰ Reminders file</button>`:""};
function icsDl(id){const t=tasks.find(x=>x.id==id);if(!t)return;const c=x=>String(x||"").replace(/\n/g," ").replace(/[,;]/g," ");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TeamTasks//EN","BEGIN:VEVENT","UID:"+t.id+"@teamtasks","DTSTAMP:"+z(Date.now()),"DTSTART:"+z(t.start),"DTEND:"+z(t.end),"SUMMARY:"+c(t.title),"LOCATION:"+c(t.place),"DESCRIPTION:"+c((t.details||"")+(perf(t)?" Artist: "+perf(t):"")),
  "BEGIN:VALARM","TRIGGER:-PT5H","ACTION:DISPLAY","DESCRIPTION:Event in 5 hours","END:VALARM","BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:Event in 30 minutes","END:VALARM","END:VEVENT","END:VCALENDAR"];
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));a.download="event.ics";document.body.appendChild(a);a.click();a.remove()}

/* ---- Live photo (camera only) ---- */
function livePhoto(){return new Promise(async res=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const i=document.createElement("input");i.type="file";i.accept="image/*";i.setAttribute("capture","environment");i.onchange=async()=>res(i.files[0]?await shrink(i.files[0]):null);i.click();return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}catch(e){alert("Allow camera access to take the live photo");return res(null)}
  const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column";
  o.innerHTML='<video autoplay playsinline muted style="flex:1;min-height:0;width:100%;object-fit:contain"></video><img id="li" style="display:none;flex:1;min-height:0;width:100%;object-fit:contain"><div style="display:flex;gap:10px;padding:16px;justify-content:center"><button class="btn" id="lc">Cancel</button><button class="btn" id="lr" style="display:none">↺ Retake</button><button class="btn p" id="lk">📷 Capture</button></div>';
  document.body.appendChild(o);const v=o.querySelector("video"),im=o.querySelector("#li"),lr=o.querySelector("#lr"),lk=o.querySelector("#lk");v.srcObject=st;let shot=null;
  const done=x=>{st.getTracks().forEach(t=>t.stop());o.remove();res(x)};
  o.querySelector("#lc").onclick=()=>done(null);
  lr.onclick=()=>{shot=null;im.style.display="none";v.style.display="block";lr.style.display="none";lk.textContent="📷 Capture"};
  lk.onclick=()=>{if(shot)return done(shot);if(!v.videoWidth)return;const c=document.createElement("canvas"),k=Math.min(1,1000/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext("2d").drawImage(v,0,0,c.width,c.height);shot=c.toDataURL("image/jpeg",.65);im.src=shot;im.style.display="block";v.style.display="none";lr.style.display="";lk.textContent="✔ Use photo"}
})}

/* ---- Task card ---- */
const stagesOf=t=>t.type=="Event"?[["setup","Setup","Setup done"],["removal","Setup removal","Setup removed"]]:t.type=="Other"?[]:[["done","Task completion","Completed"]];
const status=t=>{if(t.type=="Event")return upd[t.id+"_removal"]?"Completed":upd[t.id+"_setup"]?"Setup done":"Pending";if(t.type=="Maintenance"||t.type=="Installation")return upd[t.id+"_done"]?"Completed":"Pending";return latest(t)};
function stageHtml(t,k,l,dn,can,wait){const u=upd[t.id+"_"+k],late=k=="setup"&&Date.now()>t.start&&!canM;
  return `<div class="tl"><div class="row" style="align-items:center"><b>${l}</b><span class="chip ${u?"s-Done":"s-Pending"}">${u?dn:"Pending"}</span></div>
  ${u?`<div class="m">🔒 ${esc(nm(u.by))} · ${fmt(u.at)}</div>${u.note?`<div>${esc(u.note)}</div>`:""}<img src="${u.photo}" style="max-width:100%;border-radius:8px;margin-top:6px;display:block">${canM?`<button class="btn sm" style="margin-top:6px" onclick="resetStage('${t.id}_${k}')">Reset</button>`:""}`:can?(late?`<div class="m">Setup time is over. It must be done before the event starts.</div>`:`<input id="note_${k}" placeholder="Note (optional)"><button class="btn p" onclick="stageSubmit('${t.id}','${k}')">📷 Take live photo · mark ${dn}</button>`):(wait?`<div class="m">Accept this task to update this step.</div>`:"")}</div>`}
function card(t){
  const isArt=!!(users[me]&&users[me].designation=="Artist"),st=status(t),o=openId===t.id,mineT=inv(t).includes(me),r=rs(rk(t),me),can=(asg(t).includes(me)&&!isArt&&r=="accepted")||canM,legacy=updates.filter(x=>x.taskId===t.id&&!x.stage).sort((a,b)=>b.at-a.at),anyR=inv(t).some(i=>rs(rk(t),i));
  return `<div class="card" style="border-left:4px solid ${TC[t.type]||"#6b6890"}"><div class="row" onclick="tog('${t.id}')" style="cursor:pointer"><div><div class="t">${esc(t.title)}</div><div class="m"><span style="color:${TC[t.type]||"#b4afd9"};font-weight:600">${esc(t.type)}</span>${t.due?" · 📅 "+esc(t.due):""}</div>${t.place?`<div class="m">📍 ${esc(t.place)}</div>`:""}${t.rep?`<div class="m">🔁 Every ${esc(t.rep)} until ${esc(t.until)}</div>`:""}${t.start?`<div class="m">🕒 ${evWhen(t)}</div>`:""}${perf(t)?`<div class="m">🎤 Artist: ${[...art(t).map(i=>esc(nm(i))+" "+ic(rs(rk(t),i))),...(t.guest?[esc("Guest – "+t.guest)]:[]),...(!art(t).length&&!t.guest?(t.performers||[]).map(esc):[])].join(", ")}</div>`:""}<div class="m">👤 ${asg(t).map(i=>esc(nm(i))+" "+ic(rs(rk(t),i))).join(", ")||"Unassigned"}</div></div><span class="chip ${cls(st)}">${st}</span></div>
  ${mineT?(r?`<div class="m" style="margin-top:8px">🔒 You ${r=="accepted"?"accepted ✅":"rejected ❌"} this task</div>`:`<div class="acts"><button class="acc" onclick="respond('${rk(t)}','accepted')">✔ Accept</button><button class="rej" onclick="respond('${rk(t)}','rejected')">✖ Reject</button></div>`):""}
  ${o?`<div class="tl">${t.details?`<div>${esc(t.details)}</div>`:""}${(t.photos||[]).map(x=>`<img src="${x}" style="max-width:100%;border-radius:8px;margin-top:6px;display:block">`).join("")}
  ${t.start?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">${calBtns(t.id,canM)}</div>`:""}
  ${stagesOf(t).map(([k,l,dn])=>stageHtml(t,k,l,dn,can,asg(t).includes(me)&&!isArt&&!r)).join("")}
  ${legacy.map(u=>`<div class="u"><b>${esc(u.status)}</b> · ${esc(nm(u.by))} · <span class="m">${fmt(u.at)}</span>${u.note?`<div>${esc(u.note)}</div>`:""}${u.photo?`<img src="${u.photo}">`:""}</div>`).join("")}
  ${t.type=="Other"&&can?`<div class="tl"><select id="st">${STAT.map(x=>`<option ${x==st?"selected":""}>${x}</option>`).join("")}</select><textarea id="nt" rows="2" placeholder="Note (optional)"></textarea><input type="file" id="ph" accept="image/*" capture="environment"><button class="btn p" id="ub" onclick="sendUpdate('${t.id}')">Post update</button></div>`:""}
  ${canM?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="btn sm" target="_blank" href="${waUrl(t)}">💬 Send on WhatsApp</a><button class="btn sm" onclick="editT='${t.id}';page='new';render(1)">✏️ Edit task</button>${anyR?`<button class="btn sm" onclick="unlockResp('${t.id}')">🔓 Unlock accept/reject</button>`:""}<button class="btn sm" onclick="delTask('${t.id}')">Delete task</button>${t.series?`<button class="btn sm" onclick="delSeries('${t.id}')">Delete all upcoming</button>`:""}</div>`:""}</div>`:""}</div>`;
}
async function respond(id,status){if(rs(id,me))return;if(!confirm((status=="accepted"?"Accept":"Reject")+" this task? You can't change it later."))return;try{await db.collection("responses").doc(id+"_"+me).set({taskId:id,uid:me,status,at:Date.now()})}catch(e){alert(msg(e))}}
async function unlockResp(id){const t=tasks.find(x=>x.id==id);if(!t||!confirm("Let the assigned people choose accept/reject again?"))return;try{await Promise.all(inv(t).map(i=>db.collection("responses").doc(rk(t)+"_"+i).delete()))}catch(e){alert(msg(e))}}
async function stageSubmit(id,k){const photo=await livePhoto();if(!photo)return;const n=$("note_"+k);
  try{await db.collection("updates").doc(id+"_"+k).set({taskId:id,stage:k,status:"Done",note:n?n.value.trim():"",photo,by:me,at:Date.now()})}
  catch(e){alert(e.code=="permission-denied"?"Not allowed: already submitted, or the setup time is over.":msg(e))}}
async function resetStage(id){if(!confirm("Reset this update so it can be submitted again?"))return;try{await db.collection("updates").doc(id).delete()}catch(e){alert(msg(e))}}
async function delSeries(id){const t=tasks.find(x=>x.id==id);if(!t||!confirm("Delete this task and all upcoming tasks in this series?"))return;const myd=dateOf(t),bt=db.batch();tasks.filter(o=>o.series==t.series&&dateOf(o)>=myd).forEach(o=>bt.delete(db.collection("tasks").doc(o.id)));try{await bt.commit()}catch(e){alert(msg(e))}}
async function delTask(id){if(confirm("Delete this task?"))try{await db.collection("tasks").doc(id).delete()}catch(e){alert(msg(e))}}
function shrink(f,mx=1000,q=.65){return new Promise((r,j)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",q))};i.onerror=()=>j(new Error("Bad image"));i.src=URL.createObjectURL(f)})}
async function sendUpdate(taskId){
  const b=$("ub");b.disabled=true;b.textContent="Posting…";
  try{const f=$("ph").files[0],photo=f?await shrink(f):null;
    await db.collection("updates").add({taskId,status:$("st").value,note:$("nt").value.trim(),photo,by:me,at:Date.now()})}
  catch(e){alert("Failed: "+msg(e));b.disabled=false;b.textContent="Post update"}
}
</script></body></html>
