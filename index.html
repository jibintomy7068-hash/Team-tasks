<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Team Tasks</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#e2e1dc;--ac:#1f6feb;--ok:#1a7f4b;--wip:#b26a00;--no:#d33}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#201f1e;--tx:#f0efea;--mut:#9a9992;--ln:#33322f;--ac:#5aa0ff;--ok:#4cc38a;--wip:#e8a23a;--no:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(80px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:4px 0 10px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tab,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
.tab.on,.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.sm{padding:6px 12px;font-size:13px;text-decoration:none;display:inline-block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:600}.m{color:var(--mut);font-size:13px}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--ln);white-space:nowrap}
.s-Done{color:var(--ok);border-color:var(--ok)}.s-In{color:var(--wip);border-color:var(--wip)}.s-Pending{color:var(--mut)}
input,select,textarea{width:100%;font:inherit;padding:9px;margin:4px 0 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.ck{display:flex;align-items:center;padding:6px 0}.ck input{width:auto;margin:0 10px 0 0}
.dd{border:1px solid var(--ln);border-radius:8px;background:var(--bg);margin:4px 0 8px}.dd summary{padding:9px;cursor:pointer;list-style:none}.dd summary::after{content:"▾";float:right}.dd[open] summary{border-bottom:1px solid var(--ln)}.dd>div{padding:4px 10px}
.acts{display:flex;gap:8px;margin-top:8px}.acts button{flex:1;padding:8px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;background:transparent;border:2px solid}
.acc{color:var(--ok);border-color:var(--ok)}.acc.sel{background:var(--ok);color:#fff}.rej{color:var(--no);border-color:var(--no)}.rej.sel{background:var(--no);color:#fff}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:8px}.cd{padding:7px 0;border-radius:8px;cursor:pointer;font-size:14px}.cd.td{border:1px solid var(--ac)}.cd.sel{background:var(--ac);color:#fff}.dot{display:block;font-size:10px;line-height:1.1;color:var(--wip)}.cd.sel .dot{color:#fff}
.pbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.pbox button{border:0;border-radius:14px;padding:22px 10px;font:inherit;font-size:18px;font-weight:700;color:#fff;cursor:pointer}.pin{background:#1a9b4f}.pout{background:#d33}.pbox button:disabled{opacity:.35;cursor:default}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;background:#9a9992;margin-right:10px}.dotc.g{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.3)}
.tl{border-top:1px solid var(--ln);margin-top:10px;padding-top:8px}
.u{margin:8px 0;font-size:14px}.u img{max-width:100%;border-radius:8px;margin-top:4px;display:block}
.note{padding:20px;text-align:center;color:var(--mut)}.err{color:var(--no);font-size:13px}
</style></head><body>
<h1>📋 Team Tasks</h1>
<div id="app"><div class="note">Loading…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDuP_3_wSOJ57NPKY2yNx2uXzJn6chy1Hs",
  authDomain: "complex-av.firebaseapp.com",
  projectId: "complex-av",
  storageBucket: "complex-av.firebasestorage.app",
  messagingSenderId: "278158481445",
  appId: "1:278158481445:web:745535a04c5f066b3287cc"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const TYPES=["Event","Maintenance","Installation","Other"],STAT=["Pending","In progress","Done"],PERF=["Armando","Ghaith","Pamela","Bassi","Goran","Guest"],DES=["Manager","Supervisor","Admin","Team member","Artist"],MGR=["Manager","Supervisor","Admin"];
let editT=null,upd={},editId=null,me=null,canM=false,tasks=[],updates=[],users={},duty={},resp={},page="all",openId=null,busy=false,unsubs=[],err="",calY=new Date().getFullYear(),calM=new Date().getMonth(),selDay=null,newCount=0,lastCreated=null;
const $=id=>document.getElementById(id),A=()=>$("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=x=>new Date(x).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}),tm=x=>new Date(x).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const nm=id=>id?(users[id]?users[id].name:"Someone"):"Unassigned";
const cls=s=>s=="Pending"?"s-Pending":(s=="Completed"||s=="Done")?"s-Done":"s-In",asg=t=>t.assignees||(t.assignee?[t.assignee]:[]),art=t=>t.artists||[],inv=t=>[...new Set([...asg(t),...art(t)])],perf=t=>[...art(t).map(nm),...(t.guest?["Guest – "+t.guest]:[]),...(!art(t).length&&!t.guest?(t.performers||[]):[])].join(", ");
const rs=(t,i)=>(resp[t+"_"+i]||{}).status,ic=s=>s=="accepted"?"✅":s=="rejected"?"❌":"⏳";
const latest=t=>{const u=updates.filter(x=>x.taskId===t.id).sort((a,b)=>b.at-a.at);return u[0]?u[0].status:"Pending"};
const t12=x=>{const d=new Date(x),h=d.getHours()%12||12,m=d.getMinutes();return h+(m?":"+pad(m):"")+(d.getHours()<12?"am":"pm")};
const evWhen=t=>{const a=new Date(t.start),b=new Date(t.end);return a.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}).replace(",","")+", "+t12(t.start)+" - "+t12(t.end)+(ds(a)!=ds(b)?" (next day)":"")};
const okPh=p=>p.replace(/\D/g,"").length>=8,digits=p=>p.replace(/\D/g,"");
const msg=e=>({"auth/invalid-credential":"Wrong email or password","auth/email-already-in-use":"Email already in use","auth/weak-password":"Password needs 6+ characters","auth/invalid-email":"Invalid email"}[e.code]||e.message);
const opts=a=>a.map(x=>`<option>${x}</option>`).join("");

async function showLogin(){
  let setup=false;try{setup=!(await db.doc("config/leader").get()).exists}catch(e){}
  A().innerHTML=`<div class="card"><div class="t">${setup?"First-time setup: create the main account":"Sign in"}</div>
  ${setup?`<input id="n" placeholder="Your name"><input id="ph" type="tel" placeholder="Phone with country code, e.g. +971501234567"><select id="de"><option value="">Designation</option>${opts(DES)}</select>`:""}
  <input id="e" type="email" placeholder="Email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err">${esc(err)}</div><button class="btn p" onclick="${setup?"doSetup()":"doLogin()"}">${setup?"Create account":"Sign in"}</button></div>`;
}
async function doLogin(){err="";try{await auth.signInWithEmailAndPassword($("e").value.trim(),$("p").value)}catch(e){err=msg(e);showLogin()}}
async function doSetup(){
  const name=$("n").value.trim(),phone=$("ph").value.trim(),designation=$("de").value,email=$("e").value.trim(),pw=$("p").value;
  if(!name||!okPh(phone)||!designation)return alert("Enter your name, phone number and designation");
  busy=true;try{const c=await auth.createUserWithEmailAndPassword(email,pw),uid=c.user.uid,b=db.batch();
    b.set(db.doc("config/leader"),{owner:uid});b.set(db.doc("users/"+uid),{name,email,phone,designation,role:"leader"});await b.commit();busy=false;start(c.user)}
  catch(e){busy=false;err=msg(e);showLogin()}
}
function start(u){
  me=u.uid;const L=(c,f)=>unsubs.push(db.collection(c).onSnapshot(s=>{f(s);render()},()=>{}));
  L("users",s=>{users={};s.forEach(d=>users[d.id]=d.data());const x=users[me];canM=!!(x&&(x.role==="leader"||MGR.includes(x.designation)));if(!canM&&(page=="new"||page=="team"))page="all"});
  L("tasks",s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));checkNew()});
  L("updates",s=>{updates=s.docs.map(d=>({id:d.id,...d.data()}));upd={};updates.forEach(u=>upd[u.id]=u)});
  L("duty",s=>{duty={};s.forEach(d=>duty[d.id]=d.data())});
  L("responses",s=>{resp={};s.forEach(d=>resp[d.id]=d.data())});
}
auth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];if(busy)return;if(!u){me=null;showLogin()}else start(u)});

function checkNew(){
  if(!me)return;let seen=0;try{seen=+localStorage.getItem("seen_"+me);if(!seen){localStorage.setItem("seen_"+me,Date.now());return}}catch(e){return}
  const n=tasks.filter(t=>inv(t).includes(me)&&t.by!==me&&(t.assigned||t.created)>seen).length;
  if(n>newCount){try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
  newCount=n;document.title=(n?"("+n+") ":"")+"Team Tasks";
}
function dismissNew(){try{localStorage.setItem("seen_"+me,Date.now())}catch(e){}newCount=0;document.title="Team Tasks";render(1)}
const noticeHtml=()=>newCount?`<div class="card" style="border-color:var(--ac)" onclick="dismissNew()">🔔 <b>${newCount} new task${newCount>1?"s":""} assigned to you</b> <span class="m">(tap to dismiss)</span></div>`:"";
const createdHtml=()=>lastCreated?`<div class="card">✅ Task assigned.<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn p sm" target="_blank" href="https://wa.me/?text=${encodeURIComponent(lastCreated.txt)}">Notify on WhatsApp</a>${lastCreated.ev?calBtns(lastCreated.id,true):""}<button class="btn sm" onclick="lastCreated=null;render(1)">Close</button></div></div>`:"";
function tog(id){openId=openId===id?null:id;render(1)}
function go(k){page=k;editT=null;if(k=="calendar")selDay=selDay||ds(new Date());else selDay=null;render(1)}

function render(f){
  if(!f){const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&A().contains(ae))return;if((page=="new"&&$("f_t"))||(page=="team"&&$("m_n")))return}
  if(!me||!users[me]){A().innerHTML='<div class="note">Loading…</div>';return}
  const dc=dutyCount(),T=(k,l)=>`<button class="tab ${page==k?"on":""}" onclick="go('${k}')">${l}</button>`;
  const bar=`<div class="bar">${T("all","All")}${T("mine","My tasks")}${T("calendar","📅 Calendar")}${T("online","🟢 Online"+(dc?" ("+dc+")":""))}${canM?T("new","＋ New task")+T("team","👥 Team"):""}<button class="btn" onclick="auth.signOut()">Sign out</button></div>`;
  let body="";
  if(page=="online")body=onlineHtml();else if(page=="new"&&canM)body=taskForm(editT?tasks.find(x=>x.id==editT):null);else if(page=="team"&&canM)body=teamPanel();
  else{let L=tasks.slice().sort((a,b)=>b.created-a.created);if(page=="mine")L=L.filter(t=>inv(t).includes(me));if(page=="calendar")L=L.filter(t=>taskDays(t).includes(selDay));
    body=(page=="all"?createdHtml():"")+(page=="calendar"?calHtml():"")+(L.length?L.map(card).join(""):`<div class="note">${page=="calendar"?"No tasks on this day.":"No tasks yet."}</div>`)}
  A().innerHTML=noticeHtml()+bar+body;
}

/* ---- Calendar ---- */
function taskDays(t){if(t.start){const b=new Date(t.end),o=[],a=new Date(t.start),d=new Date(a.getFullYear(),a.getMonth(),a.getDate());while(d<=b&&o.length<60){o.push(ds(d));d.setDate(d.getDate()+1)}return o}return t.due?[t.due]:[]}
function calHtml(){
  const cnt={};tasks.forEach(t=>taskDays(t).forEach(d=>cnt[d]=(cnt[d]||0)+1));
  const first=new Date(calY,calM,1),st=first.getDay(),dim=new Date(calY,calM+1,0).getDate(),today=ds(new Date());
  let c="";for(let i=0;i<st;i++)c+="<div></div>";
  for(let d=1;d<=dim;d++){const k=calY+"-"+pad(calM+1)+"-"+pad(d),n=cnt[k]||0;c+=`<div class="cd ${k==selDay?"sel":""} ${k==today?"td":""}" onclick="pickDay('${k}')">${d}${n?`<span class="dot">${n} task${n>1?"s":""}</span>`:""}</div>`}
  return `<div class="card"><div class="row" style="align-items:center"><button class="tab" onclick="moveCal(-1)">‹</button><b>${first.toLocaleString([],{month:"long",year:"numeric"})}</b><button class="tab" onclick="moveCal(1)">›</button></div><div class="cg">${"SMTWTFS".split("").map(x=>`<div class="m">${x}</div>`).join("")}${c}</div><div class="m" style="margin-top:8px">Tasks on ${selDay}</div></div>`}
function pickDay(k){selDay=k;render(1)}
function moveCal(n){calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render(1)}

/* ---- Online / duty ---- */
const dutyCount=()=>Object.keys(users).filter(i=>duty[i]&&duty[i].on).length;
function onlineHtml(){
  const mine=duty[me]&&duty[me].on,isOn=i=>duty[i]&&duty[i].on?1:0;
  const ids=Object.keys(users).sort((a,b)=>isOn(b)-isOn(a)||(users[a].name||"").localeCompare(users[b].name||""));
  return `<div class="pbox"><button class="pin" ${mine?"disabled":""} onclick="punch(true)">Punch In</button><button class="pout" ${mine?"":"disabled"} onclick="punch(false)">Punch Out</button></div>
  <div class="card"><div class="t">Team members · ${dutyCount()} on duty</div>${ids.map(i=>{const u=users[i],d=duty[i],o=isOn(i),ph=u.phone||"";return `<div style="padding:10px 0;border-top:1px solid var(--ln)"><div><span class="dotc ${o?"g":""}"></span><b>${esc(u.name)}</b>${i==me?" (you)":""} <span class="m">· ${esc(u.designation||"Team member")}</span></div><div class="m" style="margin-left:22px">${o?"On duty since "+tm(d.since):(d&&d.out?"Off duty · last out "+fmt(d.out):"Off duty")}</div>
  <div style="margin:6px 0 0 22px;display:flex;gap:8px;flex-wrap:wrap">${ph&&i!=me?`<a class="btn sm" href="tel:${esc(ph.replace(/[^\d+]/g,""))}">📞 Call</a><a class="btn sm" target="_blank" href="https://wa.me/${digits(ph)}">💬 WhatsApp</a>`:""}${!ph&&i!=me?'<span class="m">No phone number added'+(canM?' · add it in 👥 Team → Edit':'')+'</span>':""}${canM&&o&&i!=me?`<button class="btn sm" onclick="punchOut('${i}')">Punch out</button>`:""}</div></div>`}).join("")}</div>`}
async function punch(on){const d=duty[me]||{};try{await db.collection("duty").doc(me).set(on?{on:true,since:Date.now(),out:d.out||0}:{on:false,since:d.since||0,out:Date.now()})}catch(e){alert(msg(e))}}
async function punchOut(id){if(!confirm("Punch out "+nm(id)+"?"))return;const d=duty[id]||{};try{await db.collection("duty").doc(id).set({on:false,since:d.since||0,out:Date.now()})}catch(e){alert(msg(e))}}

/* ---- New task ---- */
function sumUpd(c,id,empty){const a=[...document.querySelectorAll("."+c+":checked")].map(x=>x.dataset.n);$(id).textContent=a.length?a.join(", "):empty}
function evToggle(){const v=$("f_ty").value;$("ev").style.display=v=="Event"?"block":"none";$("du").style.display=v&&v!="Event"?"block":"none"}
function gnToggle(){$("f_gn").style.display=document.querySelector('.pf[data-n="Guest"]').checked?"block":"none"}
function taskForm(t){t=t||{};
  const E=t.type=="Event",AS=asg(t),AR=art(t),hm=x=>x?pad(new Date(x).getHours())+":"+pad(new Date(x).getMinutes()):"",artists=Object.keys(users).filter(i=>users[i].designation=="Artist"),team=Object.keys(users).filter(i=>users[i].designation!="Artist");
  return `<div class="card"><div class="t">${t.id?"Edit task":"New task"}</div><input id="f_t" placeholder="Task title" value="${esc(t.title||"")}">
<select id="f_ty" onchange="evToggle()"><option value="">Task</option>${TYPES.map(x=>`<option ${x==t.type?"selected":""}>${x}</option>`).join("")}</select>
<div id="ev" style="display:${E?"block":"none"}"><div class="m">Date</div><input id="f_ed" type="date" value="${t.start?ds(new Date(t.start)):""}"><div class="m">Start time</div><input id="f_s" type="time" value="${hm(t.start)}"><div class="m">Finish time</div><input id="f_e" type="time" value="${hm(t.end)}">
<details class="dd"><summary><b>Artist:</b> <span id="pf_s">${esc(AR.map(nm).join(", ")||"Select artist")}</span></summary><div>${artists.length?artists.map(i=>`<label class="ck"><input type="checkbox" class="pf" value="${i}" data-n="${esc(users[i].name)}" ${AR.includes(i)?"checked":""} onchange="sumUpd('pf','pf_s','Select artist')">${esc(users[i].name)}</label>`).join(""):'<div class="m" style="padding:8px 0">No artists registered yet. Add one in Team with the designation Artist.</div>'}</div></details>
<input id="f_gn" placeholder="Guest artist name (optional)" value="${esc(t.guest||"")}"></div>
<div id="du" style="display:${t.type&&!E?"block":"none"}"><div class="m">Date (shows on calendar, optional)</div><input id="f_d" type="date" value="${esc(t.due||"")}"></div>
<details class="dd"><summary><b>Assign:</b> <span id="as_s">${esc(AS.map(nm).join(", ")||"Select team members")}</span></summary><div>${team.map(i=>`<label class="ck"><input type="checkbox" class="as" value="${i}" data-n="${esc(users[i].name)}" ${AS.includes(i)?"checked":""} onchange="sumUpd('as','as_s','Select team members')">${esc(users[i].name)} <span class="m">&nbsp;· ${esc(users[i].designation||"Team member")}</span></label>`).join("")}</div></details>
<textarea id="f_x" rows="3" placeholder="Work details">${esc(t.details||"")}</textarea>
<div class="m">Photos (optional, up to 3${t.id?"; choose only to replace the current ones":""})</div><input type="file" id="f_ph" accept="image/*" multiple>
<button class="btn p" id="ab" onclick="addTask()">${t.id?"Save changes":"Assign task"}</button>${t.id?` <button class="btn" onclick="go('all')">Cancel</button>`:""}</div>`}
async function addTask(){
  const title=$("f_t").value.trim(),type=$("f_ty").value;if(!title)return alert("Enter a title");if(!type)return alert("Select the task type");
  const ids=[...document.querySelectorAll(".as:checked")].map(c=>c.value);if(!ids.length)return alert("Select at least one team member");
  const d={title,type,assignees:ids,details:$("f_x").value.trim()},E=type=="Event",DEL=firebase.firestore.FieldValue.delete();
  if(E){const dt=$("f_ed").value,s0=$("f_s").value,e0=$("f_e").value;if(!dt||!s0||!e0)return alert("Enter the date, start time and finish time");
    const s=new Date(dt+"T"+s0).getTime();let e=new Date(dt+"T"+e0).getTime();if(e<=s)e+=864e5;
    d.start=s;d.end=e;d.artists=[...document.querySelectorAll(".pf:checked")].map(c=>c.value);d.guest=$("f_gn").value.trim();if(editT){d.due=DEL;d.performers=DEL}}
  else{d.due=$("f_d").value;if(editT){d.start=DEL;d.end=DEL;d.artists=DEL;d.guest=DEL;d.performers=DEL}}
  if(!editT){d.created=Date.now();d.by=me}
  const old=editT?tasks.find(x=>x.id==editT):null,nw=[...new Set([...ids,...(d.artists||[])])].sort();if(old&&JSON.stringify(inv(old).slice().sort())!=JSON.stringify(nw))d.assigned=Date.now();
  const b=$("ab");b.disabled=true;b.textContent="Saving…";
  try{const f=[...$("f_ph").files].slice(0,3);if(f.length||!editT)d.photos=await Promise.all(f.map(x=>shrink(x,900,.6)));
    if(editT){await db.collection("tasks").doc(editT).update(d);editT=null}
    else{const r=await db.collection("tasks").add(d);
      lastCreated={id:r.id,ev:E,txt:"📋 New task: "+title+"\n"+type+(d.start?"\n🕒 "+evWhen(d):d.due?"\n📅 "+d.due:"")+"\n👤 "+ids.map(nm).join(", ")+(E&&perf(d)?"\n🎤 Artist: "+perf(d):"")+(d.details?"\n"+d.details:"")}}
    page="all";render(1)}
  catch(e){alert(msg(e));b.disabled=false;b.textContent=editT?"Save changes":"Assign task"}
}

/* ---- Team ---- */
function teamPanel(){return `<div class="card"><div class="t">Team members</div>${Object.keys(users).map(memberRow).join("")}
<div class="tl"><div class="t">Add member</div><input id="m_n" placeholder="Name"><input id="m_ph" type="tel" placeholder="Phone with country code, e.g. +971501234567">
<select id="m_de"><option value="">Designation</option>${opts(DES)}</select><input id="m_e" type="email" placeholder="Email"><input id="m_p" type="text" placeholder="Temporary password (6+ chars)">
<button class="btn p" onclick="addMember()">Add member</button></div></div>`}
function memberRow(i){const u=users[i];
  if(editId==i)return `<div class="card" style="margin:6px 0"><div class="t">${esc(u.name)}</div><input id="e_ph" type="tel" value="${esc(u.phone||"")}" placeholder="Phone with country code"><select id="e_de">${DES.map(x=>`<option ${x==(u.designation||"Team member")?"selected":""}>${x}</option>`).join("")}</select><button class="btn p sm" onclick="saveMember('${i}')">Save</button> <button class="btn sm" onclick="editId=null;render(1)">Cancel</button></div>`;
  return `<div class="row" style="align-items:center;padding:4px 0"><div class="m">${esc(u.name)} · ${esc(u.designation||"Team member")} · ${u.phone?esc(u.phone):"no phone"}<br>${esc(u.email)}</div><button class="btn sm" onclick="editId='${i}';render(1)">Edit</button></div>`}
async function saveMember(i){const phone=$("e_ph").value.trim(),designation=$("e_de").value;if(!okPh(phone))return alert("Enter a valid phone number with country code");try{await db.doc("users/"+i).update({phone,designation});editId=null;render(1)}catch(e){alert(msg(e))}}
async function addMember(){
  const name=$("m_n").value.trim(),phone=$("m_ph").value.trim(),designation=$("m_de").value,email=$("m_e").value.trim(),pw=$("m_p").value;
  if(!name||!email||!designation)return alert("Enter name, designation and email");if(!okPh(phone))return alert("Enter a valid phone number with country code");
  try{const sec=firebase.apps.find(a=>a.name=="sec")||firebase.initializeApp(firebaseConfig,"sec");
    const c=await sec.auth().createUserWithEmailAndPassword(email,pw);
    await db.doc("users/"+c.user.uid).set({name,email,phone,designation,role:"member"});await sec.auth().signOut();
    alert("Member added. Share the app link, email and password with "+name+".");render(1)}
  catch(e){alert(msg(e))}
}

/* ---- Calendar links ---- */
const z=x=>new Date(x).toISOString().replace(/[-:]|\.\d{3}/g,"");
const gcal=(t,g)=>"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t.title)+"&dates="+z(t.start)+"/"+z(t.end)+"&details="+encodeURIComponent((t.details||"")+(perf(t)?"\nArtist: "+perf(t):""))+(g?"&add="+inv(t).map(i=>users[i]&&users[i].email).filter(Boolean).map(encodeURIComponent).join(","):"");
const calBtns=(id,g)=>{const t=tasks.find(x=>x.id==id);return t&&t.start?`<a class="btn sm" target="_blank" href="${gcal(t,g)}">📅 Google Calendar</a><button class="btn sm" onclick="icsDl('${id}')">⏰ Reminders file</button>`:""};
function icsDl(id){const t=tasks.find(x=>x.id==id);if(!t)return;const c=x=>String(x||"").replace(/\n/g," ").replace(/[,;]/g," ");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TeamTasks//EN","BEGIN:VEVENT","UID:"+t.id+"@teamtasks","DTSTAMP:"+z(Date.now()),"DTSTART:"+z(t.start),"DTEND:"+z(t.end),"SUMMARY:"+c(t.title),"DESCRIPTION:"+c((t.details||"")+(perf(t)?" Artist: "+perf(t):"")),
  "BEGIN:VALARM","TRIGGER:-PT5H","ACTION:DISPLAY","DESCRIPTION:Event in 5 hours","END:VALARM","BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:Event in 30 minutes","END:VALARM","END:VEVENT","END:VCALENDAR"];
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));a.download="event.ics";document.body.appendChild(a);a.click();a.remove()}

/* ---- Live photo (camera only) ---- */
function livePhoto(){return new Promise(async res=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const i=document.createElement("input");i.type="file";i.accept="image/*";i.setAttribute("capture","environment");i.onchange=async()=>res(i.files[0]?await shrink(i.files[0]):null);i.click();return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}catch(e){alert("Allow camera access to take the live photo");return res(null)}
  const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column";
  o.innerHTML='<video autoplay playsinline muted style="flex:1;min-height:0;width:100%;object-fit:contain"></video><div style="display:flex;gap:10px;padding:16px;justify-content:center"><button class="btn" id="lc">Cancel</button><button class="btn p" id="lk">📷 Capture</button></div>';
  document.body.appendChild(o);const v=o.querySelector("video");v.srcObject=st;
  const done=x=>{st.getTracks().forEach(t=>t.stop());o.remove();res(x)};
  o.querySelector("#lc").onclick=()=>done(null);
  o.querySelector("#lk").onclick=()=>{if(!v.videoWidth)return;const c=document.createElement("canvas"),k=Math.min(1,1000/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext("2d").drawImage(v,0,0,c.width,c.height);done(c.toDataURL("image/jpeg",.65))}
})}

/* ---- Task card ---- */
const stagesOf=t=>t.type=="Event"?[["setup","Setup","Setup done"],["removal","Setup removal","Setup removed"]]:t.type=="Other"?[]:[["done","Task completion","Completed"]];
const status=t=>{if(t.type=="Event")return upd[t.id+"_removal"]?"Completed":upd[t.id+"_setup"]?"Setup done":"Pending";if(t.type=="Maintenance"||t.type=="Installation")return upd[t.id+"_done"]?"Completed":"Pending";return latest(t)};
function stageHtml(t,k,l,dn,can,wait){const u=upd[t.id+"_"+k],late=k=="setup"&&Date.now()>t.start&&!canM;
  return `<div class="tl"><div class="row" style="align-items:center"><b>${l}</b><span class="chip ${u?"s-Done":"s-Pending"}">${u?dn:"Pending"}</span></div>
  ${u?`<div class="m">🔒 ${esc(nm(u.by))} · ${fmt(u.at)}</div>${u.note?`<div>${esc(u.note)}</div>`:""}<img src="${u.photo}" style="max-width:100%;border-radius:8px;margin-top:6px;display:block">${canM?`<button class="btn sm" style="margin-top:6px" onclick="resetStage('${t.id}_${k}')">Reset</button>`:""}`:can?(late?`<div class="m">Setup time is over. It must be done before the event starts.</div>`:`<input id="note_${k}" placeholder="Note (optional)"><button class="btn p" onclick="stageSubmit('${t.id}','${k}')">📷 Take live photo · mark ${dn}</button>`):(wait?`<div class="m">Accept this task to update this step.</div>`:"")}</div>`}
function card(t){
  const isArt=!!(users[me]&&users[me].designation=="Artist"),st=status(t),o=openId===t.id,mineT=inv(t).includes(me),r=rs(t.id,me),can=(asg(t).includes(me)&&!isArt&&r=="accepted")||canM,legacy=updates.filter(x=>x.taskId===t.id&&!x.stage).sort((a,b)=>b.at-a.at),anyR=inv(t).some(i=>rs(t.id,i));
  return `<div class="card"><div class="row" onclick="tog('${t.id}')" style="cursor:pointer"><div><div class="t">${esc(t.title)}</div><div class="m">${esc(t.type)}${t.due?" · 📅 "+esc(t.due):""}</div>${t.start?`<div class="m">🕒 ${evWhen(t)}</div>`:""}${perf(t)?`<div class="m">🎤 Artist: ${[...art(t).map(i=>esc(nm(i))+" "+ic(rs(t.id,i))),...(t.guest?[esc("Guest – "+t.guest)]:[]),...(!art(t).length&&!t.guest?(t.performers||[]).map(esc):[])].join(", ")}</div>`:""}<div class="m">👤 ${asg(t).map(i=>esc(nm(i))+" "+ic(rs(t.id,i))).join(", ")||"Unassigned"}</div></div><span class="chip ${cls(st)}">${st}</span></div>
  ${mineT?(r?`<div class="m" style="margin-top:8px">🔒 You ${r=="accepted"?"accepted ✅":"rejected ❌"} this task</div>`:`<div class="acts"><button class="acc" onclick="respond('${t.id}','accepted')">✔ Accept</button><button class="rej" onclick="respond('${t.id}','rejected')">✖ Reject</button></div>`):""}
  ${o?`<div class="tl">${t.details?`<div>${esc(t.details)}</div>`:""}${(t.photos||[]).map(x=>`<img src="${x}" style="max-width:100%;border-radius:8px;margin-top:6px;display:block">`).join("")}
  ${t.start?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">${calBtns(t.id,canM)}</div>`:""}
  ${stagesOf(t).map(([k,l,dn])=>stageHtml(t,k,l,dn,can,asg(t).includes(me)&&!isArt&&!r)).join("")}
  ${legacy.map(u=>`<div class="u"><b>${esc(u.status)}</b> · ${esc(nm(u.by))} · <span class="m">${fmt(u.at)}</span>${u.note?`<div>${esc(u.note)}</div>`:""}${u.photo?`<img src="${u.photo}">`:""}</div>`).join("")}
  ${t.type=="Other"&&can?`<div class="tl"><select id="st">${STAT.map(x=>`<option ${x==st?"selected":""}>${x}</option>`).join("")}</select><textarea id="nt" rows="2" placeholder="Note (optional)"></textarea><input type="file" id="ph" accept="image/*" capture="environment"><button class="btn p" id="ub" onclick="sendUpdate('${t.id}')">Post update</button></div>`:""}
  ${canM?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm" onclick="editT='${t.id}';page='new';render(1)">✏️ Edit task</button>${anyR?`<button class="btn sm" onclick="unlockResp('${t.id}')">🔓 Unlock accept/reject</button>`:""}<button class="btn sm" onclick="delTask('${t.id}')">Delete task</button></div>`:""}</div>`:""}</div>`;
}
async function respond(id,status){if(rs(id,me))return;if(!confirm((status=="accepted"?"Accept":"Reject")+" this task? You can't change it later."))return;try{await db.collection("responses").doc(id+"_"+me).set({taskId:id,uid:me,status,at:Date.now()})}catch(e){alert(msg(e))}}
async function unlockResp(id){const t=tasks.find(x=>x.id==id);if(!t||!confirm("Let the assigned people choose accept/reject again?"))return;try{await Promise.all(inv(t).map(i=>db.collection("responses").doc(id+"_"+i).delete()))}catch(e){alert(msg(e))}}
async function stageSubmit(id,k){const photo=await livePhoto();if(!photo)return;const n=$("note_"+k);
  try{await db.collection("updates").doc(id+"_"+k).set({taskId:id,stage:k,status:"Done",note:n?n.value.trim():"",photo,by:me,at:Date.now()})}
  catch(e){alert(e.code=="permission-denied"?"Not allowed: already submitted, or the setup time is over.":msg(e))}}
async function resetStage(id){if(!confirm("Reset this update so it can be submitted again?"))return;try{await db.collection("updates").doc(id).delete()}catch(e){alert(msg(e))}}
async function delTask(id){if(confirm("Delete this task?"))try{await db.collection("tasks").doc(id).delete()}catch(e){alert(msg(e))}}
function shrink(f,mx=1000,q=.65){return new Promise((r,j)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",q))};i.onerror=()=>j(new Error("Bad image"));i.src=URL.createObjectURL(f)})}
async function sendUpdate(taskId){
  const b=$("ub");b.disabled=true;b.textContent="Posting…";
  try{const f=$("ph").files[0],photo=f?await shrink(f):null;
    await db.collection("updates").add({taskId,status:$("st").value,note:$("nt").value.trim(),photo,by:me,at:Date.now()})}
  catch(e){alert("Failed: "+msg(e));b.disabled=false;b.textContent="Post update"}
}
</script></body></html>
